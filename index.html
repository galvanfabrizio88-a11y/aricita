<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Ara 🌻</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh; overflow:hidden; font-family:Georgia,serif;
  background:linear-gradient(180deg,#fff8c9 0%,#ffe98a 45%,#f6c453 100%);
  display:flex;align-items:center;justify-content:center;color:#5b3a08;
}
.sun{position:fixed;width:260px;height:260px;border-radius:50%;background:#ffd84d;filter:blur(2px);opacity:.45;top:-90px;right:-50px}
.card{
  position:relative;z-index:2;width:min(90%,650px);padding:55px 35px 45px;
  text-align:center;background:rgba(255,255,255,.72);backdrop-filter:blur(8px);
  border:2px solid rgba(255,205,48,.65);border-radius:30px;
  box-shadow:0 20px 60px rgba(116,75,0,.2);
  animation:appear 1.2s ease;
}
h1{font-size:clamp(38px,8vw,70px);color:#e6a900;margin-bottom:12px}
.name{font-size:clamp(24px,5vw,38px);margin-bottom:28px}
.message{font-size:clamp(20px,4vw,27px);line-height:1.5;font-style:italic}
.small{margin-top:28px;font-size:15px;opacity:.7}
.flower{position:fixed;bottom:-30px;font-size:70px;animation:float 7s linear infinite;z-index:1}
.f1{left:7%;animation-delay:0s}.f2{left:25%;font-size:55px;animation-delay:2s}.f3{left:48%;font-size:85px;animation-delay:4s}.f4{left:72%;font-size:60px;animation-delay:1s}.f5{left:88%;font-size:75px;animation-delay:3s}
.petal{position:fixed;top:-30px;font-size:24px;animation:fall linear infinite;opacity:.8}
.p1{left:10%;animation-duration:7s}.p2{left:30%;animation-duration:9s;animation-delay:2s}.p3{left:55%;animation-duration:8s;animation-delay:1s}.p4{left:78%;animation-duration:10s;animation-delay:3s}.p5{left:92%;animation-duration:7s;animation-delay:4s}
@keyframes appear{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes float{0%{transform:translateY(0) rotate(-8deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-115vh) rotate(12deg);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div class="sun"></div>

<div class="petal p1">🌼</div><div class="petal p2">🌻</div>
<div class="petal p3">🌼</div><div class="petal p4">🌻</div><div class="petal p5">🌼</div>

<div class="card">
  <h1>🌻 Flores Amarillas 🌻</h1>
  <div class="name">Para vos, Ara ❤️</div>
  <div class="message">Como no nos pudimos ver te las mando por acá, gorda.</div>
  <div class="small">Aunque sea a la distancia, quería tener este detalle con vos. 🌻</div>
</div>
  <iframe
    width="1"
    height="1"
    src="https://www.youtube.com/embed/S7gMzYqXIZc?autoplay=1&loop=1&playlist=S7gMzYqXIZc"
    title="Flores Amarillas"
    frameborder="0"
    allow="autoplay">
</iframe>
<div class="flower f1">🌻</div><div class="flower f2">🌼</div>
<div class="flower f3">🌻</div><div class="flower f4">🌼</div><div class="flower f5">🌻</div>

</body>
</html>
